<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Zyntra Remote</title>
<style>
  :root { --bg: #0b1e3a; --fg: #ffffff; --muted: #b8c4d6; --link: #9cd0ff; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f3f6fa; --fg: #0b1e3a; --muted: #4a5a70; --link: #0b57d0; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 0 16px; box-sizing: border-box; text-align: center; }
  p { margin: 0.4em 0; } small { color: var(--muted); } a { color: var(--link); word-break: break-all; }
</style>
</head>
<body>
<div id="m"><p>Bağlanılıyor…</p></div>
<script>
// Bu sayfa hic degismez; yonlendirme mantigi her seferinde onbelleksiz yuklenen yonlendir.js dosyasindadir.
var s = document.createElement('script');
s.src = 'yonlendir.js?t=' + Date.now();
s.onerror = function () { document.getElementById('m').innerHTML = '<p>Sayfa yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.</p>'; };
document.body.appendChild(s);
</script>
<noscript><p>Bu sayfa için JavaScript gerekli.</p></noscript>
</body>
</html>
